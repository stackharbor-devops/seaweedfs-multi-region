name: Bug report
description: Something does not work as described in the README
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please remove passwords, tokens, IP addresses you consider private and customer data from anything you paste.
        For security problems, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Deploy a cluster
        - Add or remove a node
        - Add or remove a region
        - Replication between regions
        - Backups and restore
        - Mounts on app nodes
        - Advanced Management or sign-in
        - Health, healing or rebalancing
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: The `version` shown for the installed add-on (for example 0.1), or the git commit you installed from.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and stack
      description: Virtuozzo Application Platform / Jelastic version and hoster, and the app server image (for example the storage and nginx node images).
  - type: input
    id: topology
    attributes:
      label: Layout
      description: Number of regions and storage nodes per region, and which node the problem is on.
  - type: textarea
    id: logs
    attributes:
      label: Tasks log, status output and error messages
      description: Expand the failing entry in the environment's Tasks log and paste its output, plus the card's Status output and the exact text of any popup.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
